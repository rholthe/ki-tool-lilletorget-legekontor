# Apache reverse-proxy for legeassist (Next.js på pm2, port 3001)
# Plasseres som /etc/apache2/sites-available/ki.lilletorget.org.conf
#
# Etter at denne er aktivert kjøres `certbot --apache` som automatisk lager
# ki.lilletorget.org-le-ssl.conf (port 443) + 80→443-redirect.
#
# Krever moduler: proxy proxy_http headers rewrite ssl

<VirtualHost *:80>
    ServerName ki.lilletorget.org
    ServerAdmin ragnar@lilletorget.org

    ErrorLog ${APACHE_LOG_DIR}/legeassist-error.log
    CustomLog ${APACHE_LOG_DIR}/legeassist-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    # Si til appen (NextAuth + e-postlenker) at den kjører bak HTTPS
    RequestHeader set X-Forwarded-Proto "https"

    # flushpackets=on => send SSE-chunks videre umiddelbart (Claude-streaming)
    ProxyPass        / http://127.0.0.1:3001/ flushpackets=on timeout=300 connectiontimeout=10
    ProxyPassReverse / http://127.0.0.1:3001/
</VirtualHost>
